<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members System</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ALL_COLUMNS = ['SN', 'memberNo', 'FullNames', 'DOB', 'SEX', 'Expirydate', 'registrationdate', 'status', 'payroll number', 'employmenttype', 'spouseAddress', 'relationship'];

        function App() {
            const [query, setQuery] = useState("");
            const [members, setMembers] = useState([]);
            const [page, setPage] = useState(1);
            const [totalPages, setTotalPages] = useState(1);
            const [totalRecords, setTotalRecords] = useState(0);
            const [loading, setLoading] = useState(false);
            
            // Modal state
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [modalMode, setModalMode] = useState("add"); // "add" or "edit"
            const [formData, setFormData] = useState({});
            
            // Custom dialogs
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, memberId: null, title: "", message: "" });
            const [alertDialog, setAlertDialog] = useState({ isOpen: false, title: "", message: "", type: "success" });

            const API_BASE = "http://127.0.0.1:8000";

            const fetchMembers = async (searchQuery, pageNum) => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/members?query=${encodeURIComponent(searchQuery)}&page=${pageNum}&page_size=50`);
                    const data = await response.json();
                    if (data.error) {
                        alert(data.error);
                    } else {
                        setMembers(data.data);
                        setTotalPages(data.total_pages);
                        setTotalRecords(data.total_records);
                        setPage(data.current_page);
                    }
                } catch (error) {
                    console.error("Error fetching members:", error);
                    alert("Failed to fetch data from backend. Make sure the FastAPI server is running.");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchMembers("", 1);
            }, []);

            const handleSearch = (e) => {
                e.preventDefault();
                setPage(1);
                fetchMembers(query, 1);
            };

            const handleDownloadTemplate = () => {
                window.location.href = `${API_BASE}/template`;
            };

            const handleFileUpload = async (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                const formData = new FormData();
                formData.append("file", file);
                
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setAlertDialog({ isOpen: true, title: "Success", message: data.message, type: "success" });
                        fetchMembers(query, 1);
                    } else {
                        setAlertDialog({ isOpen: true, title: "Error", message: "Error: " + data.detail, type: "error" });
                    }
                } catch(e) {
                    console.error("Upload error:", e);
                    setAlertDialog({ isOpen: true, title: "Error", message: "Failed to upload file.", type: "error" });
                }
                setLoading(false);
                event.target.value = null; // reset file input
            };

            const handleDownload = () => {
                window.location.href = `${API_BASE}/download?query=${encodeURIComponent(query)}`;
            };

            const handleReload = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/reload`);
                    const data = await res.json();
                    alert(data.message);
                    fetchMembers(query, 1);
                } catch(e) {
                    alert("Failed to reload data");
                    setLoading(false);
                }
            };

            const promptDelete = (memberId) => {
                setConfirmDialog({
                    isOpen: true,
                    memberId: memberId,
                    title: "Delete Member",
                    message: "Are you sure you want to delete this member? This action cannot be undone."
                });
            };

            const executeDelete = async () => {
                const memberId = confirmDialog.memberId;
                setConfirmDialog({ ...confirmDialog, isOpen: false });
                
                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/members/${memberId}`, {
                        method: 'DELETE',
                    });
                    if (response.ok) {
                        setAlertDialog({ isOpen: true, title: "Success", message: "Successfully deleted", type: "success" });
                        fetchMembers(query, page);
                    } else {
                        const errData = await response.text();
                        setAlertDialog({ isOpen: true, title: "Error", message: `Error ${response.status}: ${errData}`, type: "error" });
                    }
                } catch (error) {
                    console.error("Error deleting member:", error);
                    setAlertDialog({ isOpen: true, title: "Error", message: `Network Error: ${error.message}`, type: "error" });
                }
                setLoading(false);
            };

            const handlePageChange = (newPage) => {
                if (newPage >= 1 && newPage <= totalPages) {
                    fetchMembers(query, newPage);
                }
            };

            const openAddModal = () => {
                setModalMode("add");
                const initialData = {};
                ALL_COLUMNS.forEach(col => initialData[col] = "");
                setFormData(initialData);
                setIsModalOpen(true);
            };

            const openEditModal = (member) => {
                setModalMode("edit");
                setFormData({ ...member });
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setFormData({});
            };

            const handleFormChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleFormSubmit = async (e) => {
                e.preventDefault();
                const url = modalMode === "add" ? `${API_BASE}/members` : `${API_BASE}/members/${formData._id}`;
                const method = modalMode === "add" ? "POST" : "PUT";

                try {
                    const response = await fetch(url, {
                        method: method,
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(formData)
                    });
                    const result = await response.json();
                    if (response.ok) {
                        alert(result.message);
                        closeModal();
                        fetchMembers(query, page); // refresh current page
                    } else {
                        alert("Error: " + result.detail);
                    }
                } catch (error) {
                    console.error("Error saving member:", error);
                    alert("Failed to save data.");
                }
            };

            return (
                <div className="container mx-auto p-4">
                    <h1 className="text-3xl font-bold mb-6 text-center text-blue-600">CHF Members System</h1>
                    
                    <div className="bg-white p-6 rounded-lg shadow-md mb-6">
                        <form onSubmit={handleSearch} className="flex gap-4 mb-4">
                            <input 
                                type="text" 
                                value={query} 
                                onChange={(e) => setQuery(e.target.value)} 
                                placeholder="Search by name, member number, etc..." 
                                className="flex-1 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                            <button type="submit" className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Search</button>
                        </form>
                        
                        <div className="flex justify-between items-center mt-4 pt-4 border-t border-gray-100">
                            <p className="text-gray-600 font-semibold">Found {totalRecords} records.</p>
                            
                            <div className="flex gap-3">
                                <button onClick={openAddModal} className="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                      <path fillRule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clipRule="evenodd" />
                                    </svg>
                                    Add New Member
                                </button>
                                
                                <button onClick={handleDownloadTemplate} className="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                      <path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd" />
                                    </svg>
                                    Get Template
                                </button>
                                
                                <label className="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600 flex items-center gap-2 cursor-pointer">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clipRule="evenodd" />
                                    </svg>
                                    Upload Excel
                                    <input type="file" accept=".xlsx, .xls" className="hidden" onChange={handleFileUpload} />
                                </label>
                                
                                <button onClick={handleReload} className="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                      <path fillRule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clipRule="evenodd" />
                                    </svg>
                                    Reload Excel Data
                                </button>
                                
                                <button onClick={handleDownload} className="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                      <path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd" />
                                    </svg>
                                    Download Excel
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow-md overflow-x-auto">
                        {loading ? (
                            <div className="p-8 text-center text-gray-500">Loading data...</div>
                        ) : (
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-gray-200">
                                        <th className="p-3 border-b">Member No</th>
                                        <th className="p-3 border-b">Full Names</th>
                                        <th className="p-3 border-b">DOB</th>
                                        <th className="p-3 border-b">Sex</th>
                                        <th className="p-3 border-b">Expiry Date</th>
                                        <th className="p-3 border-b">Status</th>
                                        <th className="p-3 border-b text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {members.map((m, idx) => (
                                        <tr key={idx} className="hover:bg-gray-50">
                                            <td className="p-3 border-b">{m.memberNo}</td>
                                            <td className="p-3 border-b">{m.FullNames}</td>
                                            <td className="p-3 border-b">{m.DOB}</td>
                                            <td className="p-3 border-b">{m.SEX}</td>
                                            <td className="p-3 border-b">{m.Expirydate}</td>
                                            <td className="p-3 border-b">{m.status}</td>
                                            <td className="p-3 border-b text-center space-x-4">
                                                <button onClick={() => openEditModal(m)} className="text-blue-500 hover:text-blue-700 underline text-sm">
                                                    Edit
                                                </button>
                                                <button onClick={() => promptDelete(m._id)} className="text-red-500 hover:text-red-700 underline text-sm">
                                                    Delete
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {members.length === 0 && (
                                        <tr>
                                            <td colSpan="7" className="p-6 text-center text-gray-500">No members found</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        )}
                    </div>

                    {totalPages > 1 && (
                        <div className="flex justify-center items-center gap-4 mt-6">
                            <button 
                                onClick={() => handlePageChange(page - 1)} 
                                disabled={page === 1}
                                className="px-3 py-1 bg-gray-200 rounded disabled:opacity-50"
                            >
                                Previous
                            </button>
                            <span className="text-gray-700">Page {page} of {totalPages}</span>
                            <button 
                                onClick={() => handlePageChange(page + 1)} 
                                disabled={page === totalPages}
                                className="px-3 py-1 bg-gray-200 rounded disabled:opacity-50"
                            >
                                Next
                            </button>
                        </div>
                    )}

                    {/* Confirm Dialog */}
                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[60]">
                            <div className="bg-white rounded-lg shadow-2xl max-w-sm w-full p-6 text-center transform transition-all">
                                <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                    </svg>
                                </div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">{confirmDialog.title}</h3>
                                <p className="text-gray-500 mb-6">{confirmDialog.message}</p>
                                <div className="flex justify-center gap-3">
                                    <button 
                                        onClick={() => setConfirmDialog({ ...confirmDialog, isOpen: false })}
                                        className="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 font-medium transition-colors">
                                        No, Cancel
                                    </button>
                                    <button 
                                        onClick={executeDelete}
                                        disabled={loading}
                                        className={`px-4 py-2 text-white rounded font-medium transition-colors ${loading ? 'bg-red-300' : 'bg-red-500 hover:bg-red-600'}`}>
                                        {loading ? 'Deleting...' : 'Yes, Delete'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Alert Dialog */}
                    {alertDialog.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[60]">
                            <div className="bg-white rounded-lg shadow-2xl max-w-sm w-full p-6 text-center transform transition-all">
                                <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${alertDialog.type === 'success' ? 'bg-green-100' : 'bg-red-100'}`}>
                                    {alertDialog.type === 'success' ? (
                                        <svg className="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/>
                                        </svg>
                                    ) : (
                                        <svg className="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
                                        </svg>
                                    )}
                                </div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">{alertDialog.title}</h3>
                                <p className="text-gray-500 mb-6">{alertDialog.message}</p>
                                <button 
                                    onClick={() => setAlertDialog({ ...alertDialog, isOpen: false })}
                                    className={`w-full py-2 text-white rounded font-medium transition-colors ${alertDialog.type === 'success' ? 'bg-green-500 hover:bg-green-600' : 'bg-red-500 hover:bg-red-600'}`}>
                                    OK
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center p-6 border-b">
                                    <h2 className="text-2xl font-semibold">
                                        {modalMode === "add" ? "Add New Member" : "Edit Member"}
                                    </h2>
                                    <button onClick={closeModal} className="text-gray-500 hover:text-gray-700">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                                
                                <form onSubmit={handleFormSubmit} className="p-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {ALL_COLUMNS.map(col => (
                                            <div key={col} className="flex flex-col">
                                                <label className="text-sm text-gray-600 mb-1">{col}</label>
                                                <input 
                                                    type="text" 
                                                    name={col} 
                                                    value={formData[col] || ""} 
                                                    onChange={handleFormChange} 
                                                    className="border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                                />
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <div className="mt-8 flex justify-end gap-3 border-t pt-4">
                                        <button type="button" onClick={closeModal} className="px-4 py-2 border border-gray-300 rounded text-gray-700 hover:bg-gray-50">
                                            Cancel
                                        </button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                                            {modalMode === "add" ? "Save Member" : "Update Member"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
